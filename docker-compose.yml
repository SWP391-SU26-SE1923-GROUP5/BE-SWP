services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aistudyhub-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Connection string is read from ConnectionStrings__DefaultConnection
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AIStudyHub;User Id=sa;Password=12345;TrustServerCertificate=True;"
    depends_on:
      - sqlserver
      - ollama
    networks:
      - aistudyhub-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - aistudyhub-net

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aistudyhub-net

  ollama-pull:
    image: curlimages/curl:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    networks:
      - aistudyhub-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Waiting for Ollama to be ready..."
        until curl -sf http://ollama:11434/api/tags >/dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling llama3.2:1b..."
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name":"llama3.2:1b"}' || true
        echo "Pulling nomic-embed-text:latest..."
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name":"nomic-embed-text:latest"}' || true
        echo "Done."

volumes:
  ollama_data:
  sqlserver_data:

networks:
  aistudyhub-net:
    driver: bridge
